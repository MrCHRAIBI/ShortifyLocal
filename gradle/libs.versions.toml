# Source unique des versions — errata E2 (docs/ERRATA-2026-09-05.md).
# Versions vérifiées contre registres officiels le 2026-09-05 (Google Maven, Maven Central,
# services.gradle.org, plugins.gradle.org). Zéro version inline ailleurs dans le dépôt,
# excepté le resolveur foojay dans settings.gradle.kts (limitation Gradle, documentée).
[versions]
kotlin = "2.4.10"
agp = "9.4.0"
gradleWrapper = "9.7.1"
foojayResolver = "1.0.0"          # utilisé inline dans settings.gradle.kts (exception documentée)
ksp = "2.3.11"                    # versionnement standalone KSP2 ; 2.3.10+ = compat Kotlin 2.4
composeBom = "2026.08.00"
material3 = "1.4.0"               # informatif seulement — résolu par le BOM
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.0"
hilt = "2.60.1"
androidxHilt = "1.4.0"            # hilt-work / hilt-compiler / hilt-navigation-compose
room = "2.8.4"
navigationCompose = "2.10.0"
workManager = "2.11.2"
securityCrypto = "1.1.0"          # API dépréciée ; imposée par la spec — périmètre Phase 3
playServicesAds = "25.4.0"        # périmètre Phase 7 (entrée catalogue seule)
ump = "4.0.0"                     # périmètre Phase 7
mlkitFaceDetection = "16.1.7"     # périmètre Phase 5
newPipeExtractor = "v0.26.5"      # JitPack — périmètre Phase 4 ; dépôt ajouté à ce moment-là
# ffmpeg-kit : dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl — fork maintenu, coordonnée vivante.
# AAR 8.1.7 SHA-256 = 374d3734755fd4a4f2241da23b93ab0b3bcae9bd39f01cf3bf29a5731914658b
# (repo1.maven.org 2026-07-12, 36 988 198 octets, ABI arm64-v8a + x86_64 —
#  vérification registre 2026-09-05, clause de fraîcheur appliquée et notée)
ffmpegKit = "8.1.7"
whisperCpp = "b4938"              # source seule (CMake/NDK) — Phase 2, entrée commentaire
media3 = "1.11.0"                 # périmètre Phase 5
okhttp = "5.5.0"                  # périmètre Phase 4
coil = "3.6.2"                    # périmètre Phase 6
datastore = "1.2.1"
coroutines = "1.11.0"
serializationJson = "1.11.0"      # périmètre Phase 3/4
junit = "4.13.2"

[libraries]
# — Compose (aligné BOM)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
# — AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
# — Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }
# — Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
# — Kotlinx
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
# — Pipeline / phases ultérieures (entrées catalogue E2, résolues seulement quand référencées)
ffmpegkit-full-gpl = { module = "dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl", version.ref = "ffmpegKit" }
newpipe-extractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "newPipeExtractor" }
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
ump = { module = "com.google.android.ump:user-messaging-platform", version.ref = "ump" }
mlkit-face-detection = { module = "com.google.mlkit:face-detection", version.ref = "mlkitFaceDetection" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
# — Test
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
